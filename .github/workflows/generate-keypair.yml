# GitHub Actions Workflow to Generate Ed25519 Key Pair
name: Generate Ed25519 Key Pair

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: flutter_app

jobs:
  generate-keypair:
    name: Generate Ed25519 Key Pair
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Ed25519 Key Pair
        run: |
          dart run tool/generate_keypair.dart | tee keypair_output.txt

      - name: Upload Key Pair Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ed25519-keypair
          path: flutter_app/keypair_output.txt
