# Unified GitHub Actions Workflow for License & Keypair Management
name: License & Keypair Tools

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tool mode to execute: keypair (generate new Ed25519 keypair) or license (generate machine-bound license key)'
        required: true
        type: choice
        options:
          - keypair
          - license
      machine_id:
        description: 'Machine ID / Device Fingerprint from app Settings -> Unlock section (Required for license mode)'
        required: false
        type: string

defaults:
  run:
    working-directory: flutter_app

jobs:
  license-tools:
    name: Run License Tool (${{ inputs.mode }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Ed25519 Key Pair
        if: ${{ inputs.mode == 'keypair' }}
        run: |
          dart run tool/generate_keypair.dart | tee tool_output.txt

      - name: Generate Machine License Key
        if: ${{ inputs.mode == 'license' }}
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          MACHINE_ID_INPUT: ${{ inputs.machine_id }}
        run: |
          if [ -z "$LICENSE_PRIVATE_KEY" ]; then
            echo "Error: LICENSE_PRIVATE_KEY repository secret is not set in GitHub Settings."
            exit 1
          fi
          if [ -z "$MACHINE_ID_INPUT" ]; then
            echo "Error: machine_id input parameter is required when running in license mode."
            exit 1
          fi
          dart run tool/generate_license.dart --machine-id "$MACHINE_ID_INPUT" --private-key "$LICENSE_PRIVATE_KEY" | tee tool_output.txt

      - name: Upload Tool Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-tool-output-${{ inputs.mode }}
          path: flutter_app/tool_output.txt
